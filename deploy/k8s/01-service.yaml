# ============================================================
# z-mcp —— Service（NodePort）
# 线上实况（/tmp/zdeploy-base/z-mcp.yaml 导出为准）：
#   Service  z-mcp-server  NodePort  18095 → targetPort http  nodePort 31895
#   selector app.kubernetes.io/name=z-mcp-server
#
# 端口与 NodePort 号**照抄线上**，不重新分配（改号会让既有调用方失联，收益为零）。
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: z-mcp-server
  namespace: z-mcp
  labels:
    app.kubernetes.io/name: z-mcp-server
    app.kubernetes.io/part-of: z-opc-foundation
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: z-mcp-server
  ports:
    - name: http
      port: 18095
      targetPort: http
      nodePort: 31895

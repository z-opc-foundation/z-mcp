# z-mcp 的一致性门禁.
#
# 为什么必须有: 0.1.x 的 JsonRpcController 零测试、AdminQueryService 把 version/health
# 硬编码成好话, 而 CI 一个都没有 —— 于是"合规"这件事没有任何东西在钉着.
#
# 两个 JDK 都要跑, 不是冗余:
#   - 8  是 pom 里 source/target 的基线, 也是唯一被承诺支持的版本;
#   - 17 是这个构件对外发布后 Boot 3 一侧消费者会跑的版本(官方 java-sdk 自己就要求 17+)。
#     注意它**不是**"本机下游的实际版本" —— 实测 250 上在跑的两台 host JVM 都是 1.8.0_362,
#     而 z-opc 根本没有依赖本仓(见 README 有意边界), 所以这一格守的是未来, 不是现状。
#     只用 8 编译通过不代表 17 上跑得起来(本仓的 stdio 传输会用当前 JVM 起子进程, JDK 差异会在那里暴露)。
#
# 每格跑了多少条**不写在这里**: 这段注释所在的文件本身在整树哈希的集合里, 写死数字就永远对不上,
# 而且它不会自己跟着涨(本仓有过一次"注释还写着 277, 实际 283")。真实读数由 tools/ci-tally.py
# 打印并写进 job summary, 四格缺一格当场判红; README 的"构建与测试"一节抄同一份日志。

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: verify (jdk ${{ matrix.java }})
    runs-on: ubuntu-latest
    # 挂死的测试进程不会自己结束(本仓实测撞到过一次 JDK8 httpserver 收尾死锁),
    # 不给上限就烧满 GitHub 默认的 6 小时.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17']
    steps:
      # v4 时代跑在 Node 20 上, GitHub 已经发弃用公告(强制挪到 Node 24 并每次跑刷两条
      # annotation); checkout@v7 / setup-java@v6 / upload-artifact@v7 是 node24 的原生版本,
      # setup-java v1–v4 官方文档明确"deprecated, 不再收更新".
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: mvn verify
        # -Dmaven.test.failure.ignore=true **不是放宽门禁**, 是把门禁挪到下一步: Maven 默认
        # fail-fast, 第一个模块一红, 它下游的模块一条都不跑(-fae 也救不了, 它恰恰跳过依赖失败
        # 模块的那些)。于是红消息里分不清"下游也通过了"和"下游根本没测"—— run 36237383572 里
        # z-mcp-server 那格就是这么消失的。四格全跑完再统一判, 由 tools/ci-tally.py 负责红。
        run: mvn -B -ntp verify -Dmaven.test.failure.ignore=true

      # 真正的门禁在这里: 它按根 pom 的 <modules> 现算"该有哪几格", 缺格 / 空报告 / skipped>0
      # 一律判红, 顺带把按模块的 tally 写进 job summary(读数不抄进任何被哈希的文件)。
      - name: surefire tally (缺格即红)
        # always(): mvn 那一步因为**编译**失败而中止时, 也要能看到"哪几格根本没跑" —— 那正是
        # fail-fast 藏起来的那半张脸。
        if: always()
        run: python3 tools/ci-tally.py

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports
          if-no-files-found: ignore
